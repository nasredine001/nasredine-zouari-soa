server.port=8888
# Le dépôt Git du projet sert aussi de dépôt de configuration.
# Les fichiers sont dans ConfigService/src/main/resources/myConfig.
spring.cloud.config.server.git.uri=file:${user.dir}
spring.cloud.config.server.git.search-paths=ConfigService/src/main/resources/myConfig
spring.cloud.config.server.git.default-label=main
