server.port=8085
spring.application.name=bff-service
spring.config.import=optional:configserver:http://localhost:8888

# Console GraphiQL : http://localhost:8085/graphiql
# Page auto-hébergée (static/graphiql) : les assets viennent de unpkg.com,
# dont le fichier graphiql.min.js renvoie 404 -> page bloquée sur "Loading...".
spring.graphql.graphiql.enabled=false

# Découverte plus rapide des services Produits / Commandes (démo TP4)
eureka.client.registry-fetch-interval-seconds=5

# Actuator (Spring Boot 3)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
