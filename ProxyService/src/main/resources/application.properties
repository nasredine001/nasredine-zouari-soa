server.port=8080
spring.application.name=proxy-service
spring.config.import=optional:configserver:http://localhost:8888

# Routage automatique vers les services enregistrés dans Eureka : /product-service/**
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
eureka.client.registry-fetch-interval-seconds=5

# ============================================================
# TP4 : routes explicites (point d'entrée unique sur le port 8080)
# ============================================================

# 1. API REST Produits
spring.cloud.gateway.routes[0].id=product-service-route
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/produits/**

# 2. API REST Commandes
spring.cloud.gateway.routes[1].id=order-service-route
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/commandes/**

# 3. BFF GraphQL
spring.cloud.gateway.routes[2].id=bff-graphql-route
spring.cloud.gateway.routes[2].uri=lb://bff-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/graphql

# 4. Console GraphiQL
spring.cloud.gateway.routes[3].id=bff-graphiql-route
spring.cloud.gateway.routes[3].uri=lb://bff-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/graphiql/**

# 5. Front-end Produits (Thymeleaf) : /app/products/**
spring.cloud.gateway.routes[4].id=product-frontend-route
spring.cloud.gateway.routes[4].uri=lb://product-frontend
spring.cloud.gateway.routes[4].predicates[0]=Path=/app/products/**

# 6. Front-end Commandes (Thymeleaf) : /app/orders/**
spring.cloud.gateway.routes[5].id=order-frontend-route
spring.cloud.gateway.routes[5].uri=lb://order-frontend
spring.cloud.gateway.routes[5].predicates[0]=Path=/app/orders/**

# Actuator (Spring Boot 3)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
