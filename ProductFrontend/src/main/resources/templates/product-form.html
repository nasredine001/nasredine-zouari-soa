<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouveau produit — TP4</title>
    <style>
        :root { --ink:#172033; --muted:#6b7890; --line:#e3e8f2; --brand:#2f5bea; --brand-dark:#1d3fb8; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; color:var(--ink); background:#f4f6fb; }
        .topbar { padding:26px 34px; color:#fff; background:linear-gradient(120deg,#172033,#2f5bea); }
        .topbar h1 { margin:0; font-size:24px; letter-spacing:-.02em; }
        .subtitle { margin:4px 0 0; color:#c7d3ff; font-size:13px; }
        main { max-width:720px; margin:28px auto; padding:0 20px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(23,32,51,.06); padding:26px; }
        .form { display:flex; flex-direction:column; gap:18px; }
        label { display:flex; flex-direction:column; gap:7px; font-size:13px; font-weight:600; color:#33415c; }
        input, textarea { width:100%; padding:11px 13px; border:1px solid #d5ddec; border-radius:9px; font:inherit; font-weight:400; color:var(--ink); background:#fbfcff; }
        input:focus, textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(47,91,234,.12); }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
        .actions { display:flex; justify-content:flex-end; gap:10px; padding-top:6px; }
        .btn { display:inline-flex; align-items:center; justify-content:center; padding:10px 16px; border-radius:9px; border:1px solid var(--line);
               background:#fff; color:var(--ink); font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; }
        .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
        .btn.primary:hover { background:var(--brand-dark); }
        @media (max-width:560px) { .grid2 { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<header class="topbar">
    <h1>Nouveau produit</h1>
    <p class="subtitle">Les données sont envoyées à l'API REST Produits</p>
</header>

<main>
    <form class="card form" th:action="@{/produits}" th:object="${product}" method="post">
        <label>Nom
            <input type="text" th:field="*{name}" placeholder="Clavier Gamer" required>
        </label>

        <label>Description
            <textarea th:field="*{description}" rows="3" placeholder="Description facultative"></textarea>
        </label>

        <div class="grid2">
            <label>Prix (DT)
                <input type="number" step="0.01" min="0" th:field="*{price}" required>
            </label>
            <label>Stock
                <input type="number" min="0" th:field="*{stock}" required>
            </label>
        </div>

        <div class="actions">
            <a class="btn" th:href="@{/produits}">Annuler</a>
            <button class="btn primary" type="submit">Enregistrer</button>
        </div>
    </form>
</main>
</body>
</html>
